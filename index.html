<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Ra7eNz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    document.documentElement.classList.add('js');
    try {
      if (localStorage.getItem('ra7enz-theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch {}
  </script>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: light;
      --background: #fff;
      --foreground: #000;
      --border: #d4d4d4;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #0b0b0d;
      --foreground: #fff;
      --border: #444448;
    }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--foreground);
      font-family: "Rajdhani", Arial, Helvetica, sans-serif;
      transition: background-color 180ms ease, color 180ms ease;
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 8rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.015em;
    }
    .brand {
      display: flex;
      align-items: baseline;
      white-space: nowrap;
    }
    .word-part { display: inline-block; }
    .word-part > span { display: inline-block; white-space: nowrap; }
    .js .word-part {
      width: 0;
      opacity: 0;
      overflow: hidden;
      transition: width 1100ms cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 700ms ease 100ms;
    }
    .js .brand.is-expanded .word-part {
      width: var(--part-width);
      opacity: 1;
    }
    .theme-toggle {
      position: fixed;
      top: 24px;
      right: 24px;
      min-height: 44px;
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--background);
      color: var(--foreground);
      font: 600 16px/1.4 "Rajdhani", Arial, Helvetica, sans-serif;
      cursor: pointer;
      transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease;
    }
    .theme-toggle:hover { border-color: var(--foreground); }
    .theme-toggle:focus-visible {
      outline: 2px solid var(--foreground);
      outline-offset: 4px;
    }
    @media (prefers-reduced-motion: reduce) {
      body, .theme-toggle { transition: none; }
      .js .brand .word-part {
        width: auto;
        opacity: 1;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false" aria-label="Night mode">Night mode</button>
  <main><h1 class="brand" aria-label="Ra7eNz"><span aria-hidden="true">R</span><span class="word-part" aria-hidden="true"><span>a</span></span><span aria-hidden="true">7</span><span class="word-part" aria-hidden="true"><span>eNz</span></span></h1></main>
  <script>
    const brand = document.querySelector('.brand');
    async function revealTitle() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      await Promise.race([
        document.fonts.ready,
        new Promise(resolve => setTimeout(resolve, 1500))
      ]);
      function measureLetters() {
        const fontSize = parseFloat(getComputedStyle(brand).fontSize);
        brand.querySelectorAll('.word-part').forEach(part => {
          const width = part.firstElementChild.getBoundingClientRect().width;
          part.style.setProperty('--part-width', (width / fontSize) + 'em');
        });
      }
      measureLetters();
      document.fonts.ready.then(measureLetters);
      setTimeout(() => brand.classList.add('is-expanded'), 650);
    }
    revealTitle();
    const toggle = document.getElementById('theme-toggle');
    const themeColor = document.querySelector('meta[name="theme-color"]');
    function applyTheme(theme) {
      const dark = theme === 'dark';
      document.documentElement.dataset.theme = theme;
      toggle.setAttribute('aria-pressed', String(dark));
      toggle.textContent = dark ? 'Light mode' : 'Night mode';
      themeColor.setAttribute('content', dark ? '#0b0b0d' : '#ffffff');
    }
    applyTheme(document.documentElement.dataset.theme);
    toggle.addEventListener('click', () => {
      const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(theme);
      try { localStorage.setItem('ra7enz-theme', theme); } catch {}
    });
  </script>
</body>
</html>
